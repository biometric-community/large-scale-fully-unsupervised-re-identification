name: paper-results

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper-results:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt pytest scipy scikit-learn
      - name: Check results against the paper
        run: python -m pytest tests -v -ra --tb=short
